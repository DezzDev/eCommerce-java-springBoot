services:
  mysql:
    image: mysql:8.4
    container_name: mysql-container-dream-shops
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: dream_shops_db
      MYSQL_USER: spring
      MYSQL_PASSWORD: spring
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: